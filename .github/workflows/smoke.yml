name: Smoke

on:
  push:
  pull_request:

jobs:
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - name: Compile public Python sources
        run: |
          python -m compileall -q AV_EventRecognition ApplyYOLOE DetectSound Explore_Masks Visualize_Dataset
